AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Biblioteca Cloud - Componente IaaS. VPC propia con una subred publica,
  Internet Gateway, tabla de rutas, grupo de seguridad sin SSH y una instancia
  EC2 pequena (t4g.micro) que publica una pagina de estado del nodo.
  La instancia se administra con SSM Session Manager (sin llaves SSH) y se
  mantiene detenida cuando no se esta demostrando para minimizar costos.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]+"
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.nano, t4g.micro, t3.micro]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Ultima AMI de Amazon Linux 2023 (arm64) resuelta desde SSM.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.20.1.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "biblioteca-cloud-vpc-${Stage}" }
        - { Key: Proyecto, Value: biblioteca-cloud }
        - { Key: Etapa, Value: proyecto-final }
        - { Key: Curso, Value: udea-2026-2 }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "biblioteca-cloud-igw-${Stage}" }
        - { Key: Proyecto, Value: biblioteca-cloud }

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "biblioteca-cloud-subred-publica-${Stage}" }
        - { Key: Proyecto, Value: biblioteca-cloud }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "biblioteca-cloud-rt-publica-${Stage}" }
        - { Key: Proyecto, Value: biblioteca-cloud }

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Solo HTTP (80) entrante para la pagina de estado. No se abre SSH (22):
  # la administracion se hace con SSM Session Manager.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "biblioteca-cloud-sg-web-${Stage}"
      GroupDescription: Biblioteca Cloud - HTTP de solo lectura, sin SSH
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Pagina de estado del nodo IaaS
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS saliente (actualizaciones y SSM)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP saliente (repositorios de paquetes)
      Tags:
        - { Key: Name, Value: !Sub "biblioteca-cloud-sg-web-${Stage}" }
        - { Key: Proyecto, Value: biblioteca-cloud }

  # Rol de la instancia: unicamente la politica administrada para SSM.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "biblioteca-cloud-ec2-ssm-${Stage}"
      Description: Permite administrar la instancia via SSM Session Manager (sin SSH)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: Proyecto, Value: biblioteca-cloud }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "biblioteca-cloud-ec2-perfil-${Stage}"
      Roles: [!Ref InstanceRole]

  DemoInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultPublicRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf install -y nginx
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          md() { curl -s -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/$1"; }
          INSTANCE_ID=$(md instance-id)
          AZ=$(md placement/availability-zone)
          TYPE=$(md instance-type)
          PRIV_IP=$(md local-ipv4)
          cat > /usr/share/nginx/html/index.html <<HTML
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Biblioteca Cloud - Nodo IaaS</title>
          <style>body{font-family:system-ui,sans-serif;background:#f6f4ef;color:#1f2a2e;max-width:720px;margin:48px auto;padding:0 16px}
          h1{color:#1f5f5b}table{border-collapse:collapse;width:100%}td{border-bottom:1px solid #ddd;padding:8px}td:first-child{font-weight:600;width:40%}</style></head>
          <body><h1>Biblioteca Cloud &middot; Nodo IaaS (EC2)</h1>
          <p>Instancia de demostracion del componente de Infraestructura como Servicio del proyecto final de Cloud Computing (UdeA 2026-2).
          La aplicacion web se sirve desde S3 + CloudFront y el backend es serverless (API Gateway + Lambda + DynamoDB).</p>
          <table>
          <tr><td>Instance ID</td><td>$INSTANCE_ID</td></tr>
          <tr><td>Tipo</td><td>$TYPE</td></tr>
          <tr><td>Zona de disponibilidad</td><td>$AZ</td></tr>
          <tr><td>IP privada (subred publica ${PublicSubnetCidr})</td><td>$PRIV_IP</td></tr>
          <tr><td>VPC</td><td>${VpcCidr}</td></tr>
          <tr><td>Acceso administrativo</td><td>SSM Session Manager (sin SSH)</td></tr>
          </table></body></html>
          HTML
          systemctl enable --now nginx
      Tags:
        - { Key: Name, Value: !Sub "biblioteca-cloud-ec2-${Stage}" }
        - { Key: Proyecto, Value: biblioteca-cloud }
        - { Key: Etapa, Value: proyecto-final }
        - { Key: Curso, Value: udea-2026-2 }

Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnetId:
    Value: !Ref PublicSubnet
  RouteTableId:
    Value: !Ref PublicRouteTable
  SecurityGroupId:
    Value: !Ref WebSecurityGroup
  InstanceId:
    Value: !Ref DemoInstance
  InstancePublicDns:
    Description: Cambia cada vez que la instancia se detiene y se vuelve a iniciar
    Value: !GetAtt DemoInstance.PublicDnsName
